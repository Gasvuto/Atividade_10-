<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/index.css">
    <title>Document</title>
    <script src="https://kit.fontawesome.com/3f21966000.js" crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
</head>
<body>
    <header>
        <nav class="navbar">
            <img src="assets/img/Sem nome (200 x 200 px).png" alt="logo">
            <h1> Faça seu login</h1>
            <button id="themeToggle" type="button">Dark Mode</button>
            <div class="bars-icon">
                <i class="fa-solid fa-bars"></i>
                <ul class="menu">
                    <li><a href="index.html">Login</a></li>
                    <li><a href="cadastro.html">Criar conta</a></li>
                    <li><a href="esqueci_senha.html">Esqueci minha senha</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main>
        <div id="container">
            <form method="get" action="dashboard.html">
                <label for="email">Email:</label>
                <input type="email" name="email" id="email" placeholder="empresa@gmail.com" required>
        
                <label for="senha_padrao">Senha :</label>
                <input type="password" name="senha_padrao" id="senha_padrao" placeholder="digite sua senha">

                <button id="login" type="submit">LOGIN</button> 
            </form>
            <div class="links_extra">
                <a href="cadastro.html">Criar conta</a>
                <a href="esqueci_senha.html">Esqueci minha senha</a>
            </div>
        </div>  

    </main>
    <footer>
        <h5>© 2026 Smart Control. Todos os direitos reservados.</h5>
    </footer>
   

    <script src="assets/js/index.js"></script>
</body>
</html>
