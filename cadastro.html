        <!DOCTYPE html>
<html lang="pt-BR">
<head>

<body>
    <header>
        <img src="assets/img/Sem nome (200 x 200 px).png" alt="Logo">

    </header>
    <main>
        <form method="get" action=dashboard.html>
            
            <label for="nome">Nome Completo</label><br><br>
            <input type="text" id="nome" placeholder="Digite seu nome completo..." required><br><br>

            <label for="email">E-mail</label><br><br>
            <input type="email" id="email" placeholder="Digite seu email..." required><br><br>

            <label for="senha">Senha</label><br><br>
            <input minlength="8" type="password" id="senha" placeholder="Digite sua senha..." required><br><br>

            <label for="acesso">Selecione o seu nivel de acesso</label>
            <select name="acesso" id="acesso"required>
                <option selected hidden value="">Selecione o seu nível de acesso</option>
                <option value="Administrador" >Administrador</option>
                <option value="Moderador" >Moderador</option>
                <option value="Membro" >Membro</option>
                <option value="Visitante" >Visitante</option>
            </select>
            
            <details>
                <summary>Termos de uso mt legais e nada comprometedores</summary>
                <p> Eu autorizo a vender meus dados para empresas 100% honestas e nem um pouco ganasiosas blá blá blá blá blá blá blá blá...</p>
                <label for="termos">Eu concordo que li todos os termos :)</label>
                <input type="checkbox" id="termos" required>
            </details>
    

            <br><a href="dashboard.html"><button type="submit">Fazer cadastro</button></a><br>
            <br><a href="index.html"><button type="button">Já tenho cadastro</button></a>
        </form>
    </main>
