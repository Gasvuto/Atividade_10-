<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/cadastro.css">
    <title>Tela de cadastro</title>
    <script src="https://kit.fontawesome.com/3f21966000.js" crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
</head>
<body>
    <header>
        <nav class="navbar">
            <img src="assets/img/Sem nome (200 x 200 px).png" alt="Logo">
            <h1>Tela de cadastro</h1>
            <button id="themeToggle" type="button">Dark Mode</button>
            <div class="bars-icon">
                <i class="fa-solid fa-bars"></i>
                <ul class="menu">
                    <li><a href="index.html">Login</a></li>
                    <li><a href="cadastro.html">Criar conta</a></li>
                    <li><a href="esqueci_senha.html">Esqueci minha senha</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main>
        <div id="container">
            <h2>Criar uma conta</h2>

            <form method="get" action="dashboard.html">
                <label for="nome">Nome completo</label>
                <input type="text" name="nome" id="nome" placeholder="Enter..." required>

                <label for="email">E-mail</label>
                <input type="email" name="email" id="email" placeholder="Enter..." required>

                <label for="senha">Senha</label>
                <input minlength="8" type="password" name="senha" id="senha" placeholder="Enter..." required>

                <label for="acesso">Selecione o seu nível de acesso</label>
                <select name="acesso" id="acesso" required>
                    <option selected hidden value="">Selecione o seu nível de acesso</option>
                    <option value="Administrador">Administrador</option>
                    <option value="Moderador">Moderador</option>
                    <option value="Membro">Membro</option>
                    <option value="Visitante">Visitante</option>
                </select>

                <details>
                    <summary>Termos de uso</summary>
                    <p>Ao criar uma conta, você concorda com os termos de uso e a política de privacidade da Smart Control.</p>
                    <label for="termos" class="checkbox_label">
                        <input type="checkbox" id="termos" required>
                        Eu li e concordo com os termos de uso
                    </label>
                </details>

                <button id="cadastrar" type="submit">Fazer cadastro</button>
            </form>

            <div class="links_extra">
                <a href="index.html">Já tenho cadastro</a>
            </div>
        </div>
    </main>

    <footer>
        <h5>Smart Control</h5>
    </footer>

    <script src="assets/js/cadastro.js"></script>
</body>
</html>
